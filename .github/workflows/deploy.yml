name: Deploy Frontend

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Verify Bluestreams disk
        run: |
          mountpoint -q /mnt/bluestreams || {
            echo "ERROR: /mnt/bluestreams is not mounted"
            exit 1
          }

      - name: Update repository
        run: |
          cd /mnt/bluestreams/BackUp/repos/bluestreams-frontend
          git fetch origin dev
          git reset --hard origin/dev

      - name: Build frontend Docker image
        run: |
          cd /mnt/bluestreams/BackUp/repos/bluestreams
          docker compose build frontend

      - name: Deploy frontend
        run: |
          cd /mnt/bluestreams/BackUp/repos/bluestreams
          docker compose up -d frontend

      - name: Verify frontend
        run: |
          docker ps --filter "name=bluestreams-frontend"
