name: Deploy Frontend

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: npm install

      - name: Build
        run: npm run build

      - name: Restart frontend
        shell: powershell
        run: |
          & "C:\Users\Sergio\AppData\Roaming\npm\pm2.cmd" restart frontend
